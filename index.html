<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicativo em Manutenção</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#FFD600; /* Fundo amarelo */
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        text-align:center;
        padding:20px;
    }

    .container{
        background:#fff;
        border-radius:20px;
        padding:40px 30px;
        max-width:700px;
        width:100%;
        box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    h1{
        color:#d60000;
        font-size:3rem;
        font-weight:900;
        text-transform:uppercase;
        margin-bottom:20px;
        animation:pulse 1.2s infinite;
    }

    p{
        color:#333;
        font-size:1.4rem;
        line-height:1.6;
    }

    .icon{
        font-size:80px;
        margin-bottom:20px;
    }

    @keyframes pulse{
        0%{transform:scale(1);}
        50%{transform:scale(1.08);}
        100%{transform:scale(1);}
    }

    /* Tablet */
    @media (max-width:768px){
        h1{
            font-size:2.3rem;
        }

        p{
            font-size:1.2rem;
        }

        .container{
            padding:30px 20px;
        }
    }

    /* Celular */
    @media (max-width:480px){
        h1{
            font-size:1.8rem;
        }

        p{
            font-size:1rem;
        }

        .icon{
            font-size:60px;
        }
    }
</style>

</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>

    <h1>Aplicativo em Manutenção</h1>

    <p>
        Estamos realizando melhorias para oferecer uma experiência ainda melhor.
        O aplicativo ficará indisponível temporariamente.
        <br><br>
        Agradecemos pela compreensão e pedimos que tente acessar novamente em breve.
    </p>
</div>

</body>
</html>
