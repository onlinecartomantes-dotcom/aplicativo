
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Aguarde...</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#fff8dc,#ffe58a,#ffd54f);
color:#3d2f00;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
padding:20px;
}

.box{
max-width:420px;
width:100%;
background:#ffffff;
padding:35px 25px;
border-radius:22px;
box-shadow:0 15px 40px rgba(0,0,0,0.12);
border:2px solid #f4c430;
animation:subir .6s ease;
}

@keyframes subir{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.loader{
width:75px;
height:75px;
border:7px solid #ffe58a;
border-top:7px solid #d4af37;
border-radius:50%;
animation:gira 1s linear infinite;
margin:auto;
margin-bottom:25px;
}

@keyframes gira{
100%{
transform:rotate(360deg);
}
}

h1{
font-size:28px;
margin-bottom:12px;
color:#5a4300;
}

p{
font-size:16px;
line-height:1.6;
color:#6b5200;
overflow-wrap:anywhere;
}

small{
display:block;
margin-top:18px;
font-size:14px;
color:#8a6b00;
}

.barra{
width:100%;
height:10px;
background:#ffe58a;
border-radius:30px;
overflow:hidden;
margin-top:25px;
}

.progresso{
height:100%;
width:0%;
background:linear-gradient(90deg,#d4af37,#f4c430,#ffd700);
animation:carrega 4s linear infinite;
}

@keyframes carrega{
0%{width:0%;}
100%{width:100%;}
}

.status{
margin-top:18px;
font-weight:bold;
font-size:15px;
color:#5a4300;
}
</style>
</head>

<body>

<div class="box">

<div class="loader"></div>

<h1>Preparando Pagamento</h1>

<p id="msg">
Estamos conectando ao servidor seguro.<br>
Não feche esta página.
</p>

<div class="barra">
<div class="progresso"></div>
</div>

<div class="status" id="status">
Iniciando conexão...
</div>

<small>Isso pode levar alguns segundos.</small>

</div>

<script>
const API = "https://api-r8v0.onrender.com";

const params = new URLSearchParams(window.location.search);
const valor = Number(params.get("valor"));
const descricao = params.get("descricao") || "Pagamento PIX";

const msg = document.getElementById("msg");
const statusTxt = document.getElementById("status");

async function acordarRender(){

  msg.innerHTML = "Conectando ao servidor...";
  statusTxt.innerText = "Aguarde, preparando ambiente seguro...";

  if(!Number.isFinite(valor) || valor <= 0){
    msg.innerText = "Valor inválido. Volte e tente novamente.";
    statusTxt.innerText = "Não foi possível iniciar o pagamento.";
    document.querySelector(".loader").style.display = "none";
    document.querySelector(".barra").style.display = "none";
    return;
  }

  try{
    // Verifica se a API responde.
    const teste = await fetch(API + "/");

    if(!teste.ok){
      throw new Error("O servidor não respondeu corretamente.");
    }

    statusTxt.innerText = "Servidor online! Gerando pagamento PIX...";

    // Solicita a criação do pagamento.
    const resposta = await fetch(API + "/create-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        transaction_amount: valor,
        description: descricao
      })
    });

    const dados = await resposta.json();

    if(!resposta.ok){
      const detalhe =
        dados?.details?.cause?.[0]?.description ||
        dados?.details?.message ||
        dados?.error ||
        "O Mercado Pago recusou a solicitação.";

      throw new Error(detalhe);
    }

    const transacao =
      dados?.point_of_interaction?.transaction_data;

    if(transacao?.ticket_url){
      statusTxt.innerText = "Pagamento criado! Abrindo PIX...";
      window.location.href = transacao.ticket_url;
      return;
    }

    if(transacao?.qr_code){
      msg.innerText =
        "Código PIX copia e cola:\n\n" + transacao.qr_code;

      statusTxt.innerText =
        "Pagamento gerado. Copie o código PIX para pagar.";

      document.querySelector(".loader").style.display = "none";
      document.querySelector(".barra").style.display = "none";
      return;
    }

    throw new Error(
      "O Mercado Pago não retornou o link nem o código PIX."
    );

  }catch(erro){
    console.error("Erro na comunicação:", erro);

    msg.innerText =
      "Não foi possível gerar o pagamento: " + erro.message;

    statusTxt.innerText =
      "Verifique a configuração da API e tente novamente.";

    document.querySelector(".loader").style.display = "none";
    document.querySelector(".barra").style.display = "none";
  }
}

acordarRender();
</script>

</body>
</html>
