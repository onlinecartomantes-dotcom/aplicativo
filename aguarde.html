
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Aguarde...</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #fff8dc, #ffe58a, #ffd54f);
  color: #3d2f00;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  padding: 20px;
}

.box {
  max-width: 420px;
  width: 100%;
  background: #fff;
  padding: 35px 25px;
  border-radius: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,.12);
  border: 2px solid #f4c430;
  animation: subir .6s ease;
}

@keyframes subir {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.loader {
  width: 75px;
  height: 75px;
  border: 7px solid #ffe58a;
  border-top: 7px solid #d4af37;
  border-radius: 50%;
  animation: gira 1s linear infinite;
  margin: auto auto 25px;
}

@keyframes gira {
  to { transform: rotate(360deg); }
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
  color: #5a4300;
}

p {
  font-size: 16px;
  line-height: 1.6;
  color: #6b5200;
  overflow-wrap: anywhere;
}

small {
  display: block;
  margin-top: 18px;
  font-size: 14px;
  color: #8a6b00;
}

.barra {
  width: 100%;
  height: 10px;
  background: #ffe58a;
  border-radius: 30px;
  overflow: hidden;
  margin-top: 25px;
}

.progresso {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #d4af37, #f4c430, #ffd700);
  animation: carrega 4s linear infinite;
}

@keyframes carrega {
  to { width: 100%; }
}

.status {
  margin-top: 18px;
  font-weight: bold;
  font-size: 15px;
  color: #5a4300;
}

.botao {
  display: none;
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 25px;
  background: #008f72;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box">

  <div class="loader" id="loader"></div>

  <h1>Preparando Pagamento</h1>

  <p id="msg">
    Estamos conectando ao servidor seguro.<br>
    Não feche esta página.
  </p>

  <div class="barra" id="barra">
    <div class="progresso"></div>
  </div>

  <div class="status" id="status">
    Iniciando conexão...
  </div>

  <button class="botao" id="tentarNovamente">
    Tentar novamente
  </button>

  <small>Isso pode levar alguns segundos.</small>

</div>

<script>
"use strict";

const API = "https://api-r8v0.onrender.com";

const params = new URLSearchParams(window.location.search);

const valorTexto = params.get("valor");
const descricao = params.get("descricao");

const valor = Number(valorTexto);

const msg = document.getElementById("msg");
const statusTxt = document.getElementById("status");
const loader = document.getElementById("loader");
const barra = document.getElementById("barra");
const botao = document.getElementById("tentarNovamente");

let processando = false;

function mostrarErro(mensagem) {
  loader.style.display = "none";
  barra.style.display = "none";

  msg.textContent = mensagem;
  statusTxt.textContent = "Não foi possível gerar o pagamento.";

  botao.style.display = "block";
  botao.disabled = false;
  botao.textContent = "Tentar novamente";
}

async function iniciarPagamento() {
  if (processando) return;
  processando = true;

  botao.style.display = "none";
  loader.style.display = "block";
  barra.style.display = "block";

  try {
    // Confere os dados recebidos do pix.html
    if (
      !valorTexto ||
      !Number.isFinite(valor) ||
      valor <= 0 ||
      !descricao ||
      !descricao.trim()
    ) {
      throw new Error(
        "Dados inválidos. Volte à página anterior e selecione o pagamento novamente."
      );
    }

    msg.textContent = "Estamos conectando ao servidor seguro...";
    statusTxt.textContent = "Acordando servidor...";

    // Tenta acordar o Render.
    // A resposta do GET não precisa ser acessível pelo navegador
    // para que o servidor receba a requisição.
    try {
      await fetch(API + "/", {
        method: "GET",
        mode: "no-cors",
        cache: "no-store"
      });
    } catch (erro) {
      console.log("Primeira tentativa de conexão:", erro);
    }

    statusTxt.textContent = "Preparando seu pagamento PIX...";
    msg.textContent = "Aguarde enquanto solicitamos a criação do pagamento.";

    // Solicita a criação real do pagamento na API
    const resposta = await fetch(API + "/create-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        transaction_amount: valor,
        description: descricao
      })
    });

    let dados;

    try {
      dados = await resposta.json();
    } catch {
      throw new Error("A API retornou uma resposta inválida.");
    }

    if (!resposta.ok) {
      console.error("Resposta de erro da API:", dados);

      const detalhe =
        dados.details?.message ||
        dados.message ||
        dados.error;

      throw new Error(
        detalhe
          ? "Mercado Pago: " + detalhe
          : "Erro ao gerar pagamento. Verifique a configuração da API."
      );
    }

    // Link de pagamento PIX retornado pelo Mercado Pago
    const linkPix =
      dados.point_of_interaction?.transaction_data?.ticket_url;

    if (!linkPix) {
      console.error("Resposta recebida:", dados);
      throw new Error(
        "O pagamento foi solicitado, mas a API não retornou o link PIX."
      );
    }

    // Aceita somente um destino HTTPS do Mercado Pago
    const urlPagamento = new URL(linkPix);

    if (
      urlPagamento.protocol !== "https:" ||
      !(
        urlPagamento.hostname === "mercadopago.com.br" ||
        urlPagamento.hostname.endsWith(".mercadopago.com.br") ||
        urlPagamento.hostname === "mercadopago.com" ||
        urlPagamento.hostname.endsWith(".mercadopago.com")
      )
    ) {
      throw new Error("O endereço de pagamento retornado não é válido.");
    }

    statusTxt.textContent = "Pagamento criado! Redirecionando...";
    msg.textContent = "Você será encaminhado para concluir o pagamento.";

    window.location.href = urlPagamento.href;

  } catch (erro) {
    console.error("Erro ao iniciar pagamento:", erro);
    mostrarErro(erro.message || "Ocorreu um erro inesperado.");
  } finally {
    processando = false;
  }
}

botao.addEventListener("click", iniciarPagamento);

iniciarPagamento();
</script>

</body>
</html>
